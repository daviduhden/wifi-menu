name: Agent and skills synchronization

on:
  pull_request:

permissions:
  contents: read

jobs:
  agent-skills-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and PR base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check agent and skills synchronization
        run: perl scripts/check-agent-sync.pl --base "${{ github.event.pull_request.base.sha }}"
